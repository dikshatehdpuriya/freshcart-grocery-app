<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FreshCart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">Fresh<span>Cart</span></div>
      <div class="nav-links">
        <a href="index.html">Shop</a>
        <a href="orders.html">My Orders</a>
        <a href="cart.html" class="cart-link">
          🛒 Cart <span id="cart-count">0</span>
        </a>
        <div id="nav-auth" class="nav-auth"></div>
      </div>
    </div>
  </nav>

  <main>
    <div class="auth-layout">
      <form id="login-form" class="form-card auth-card">
        <h1 class="page-title">Welcome back</h1>
        <p class="page-subtitle">Log in to continue to checkout and view your orders.</p>

        <p id="login-error" class="form-error hidden"></p>

        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="jane@example.com" required />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
