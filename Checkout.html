<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — FreshCart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">Fresh<span>Cart</span></div>
      <div class="nav-links">
        <a href="index.html">Shop</a>
        <a href="orders.html">My Orders</a>
        <a href="cart.html" class="cart-link">
          🛒 Cart <span id="cart-count">0</span>
        </a>
        <div id="nav-auth" class="nav-auth"></div>
      </div>
    </div>
  </nav>

  <main>
    <h1 class="page-title">Checkout</h1>
    <p class="page-subtitle">Enter your delivery details to place the order.</p>

    
    <div id="checkout-empty-notice" class="notice hidden">
      Your cart is empty, so there's nothing to check out.
      <a href="index.html">Go back to shopping →</a>
    </div>

    <div class="checkout-layout">
      
      <form id="checkout-form" class="form-card">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="Jane Doe" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 555 123 4567" required />
        </div>

        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" rows="3" placeholder="123 Main St, Apt 4B, Springfield" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="delivery-date">Delivery Date</label>
            <input type="date" id="delivery-date" required />
          </div>

          <div class="form-group">
            <label for="delivery-slot">Delivery Time Slot</label>
            <select id="delivery-slot" required>
              <option value="" disabled selected>Select a time slot</option>
              <option value="8:00 AM - 10:00 AM">8:00 AM - 10:00 AM</option>
              <option value="10:00 AM - 12:00 PM">10:00 AM - 12:00 PM</option>
              <option value="12:00 PM - 2:00 PM">12:00 PM - 2:00 PM</option>
              <option value="2:00 PM - 4:00 PM">2:00 PM - 4:00 PM</option>
              <option value="4:00 PM - 6:00 PM">4:00 PM - 6:00 PM</option>
              <option value="6:00 PM - 8:00 PM">6:00 PM - 8:00 PM</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Place Order</button>
      </form>

      
      <aside class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Items</span>
          <span id="co-item-count">0</span>
        </div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="co-subtotal">₹0.00</span>
        </div>
        <div class="summary-row">
          <span>Delivery Fee</span>
          <span id="co-delivery">₹0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="co-total">₹0.00</span>
        </div>
      </aside>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
